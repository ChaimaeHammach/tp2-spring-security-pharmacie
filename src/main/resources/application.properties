spring.application.name=pharma_security
server.port=8080

# ===================== MySQL =====================
# Base créée automatiquement. Adapte username/password si besoin (XAMPP : root sans mot de passe).
spring.datasource.url=jdbc:mysql://localhost:3306/pharma_security_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ===================== JPA =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================== Thymeleaf =====================
spring.thymeleaf.cache=false

# Affiche les décisions de Spring Security dans la console (utile pour comprendre / débugger)
# logging.level.org.springframework.security=DEBUG
