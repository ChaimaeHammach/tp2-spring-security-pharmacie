<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Accueil')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('home')}"></nav>

<main class="container">
    <h1 class="h3">Bienvenue, <span sec:authentication="name">user</span></h1>
    <p class="text-muted">
        Vos rôles : <span sec:authentication="principal.authorities">[ROLE]</span>
    </p>

    <!-- Chaque carte n'est affichée qu'aux rôles concernés -->
    <div class="row g-3 mt-2">
        <div class="col-md-6 col-lg-3" sec:authorize="hasAnyRole('ADMIN','PHARMACIEN','CLIENT')">
            <a th:href="@{/medicaments}" class="text-decoration-none text-reset">
                <div class="card carte-role shadow-sm h-100"><div class="card-body">
                    <h2 class="h6">💊 Médicaments</h2>
                    <p class="small text-muted mb-0" sec:authorize="hasRole('CLIENT')">Consulter les médicaments disponibles.</p>
                    <p class="small text-muted mb-0" sec:authorize="hasRole('PHARMACIEN')">Consulter et modifier les stocks.</p>
                    <p class="small text-muted mb-0" sec:authorize="hasRole('ADMIN')">Ajouter, modifier, supprimer des médicaments.</p>
                </div></div>
            </a>
        </div>
        <div class="col-md-6 col-lg-3" sec:authorize="hasAnyRole('ADMIN','PHARMACIEN','CAISSIER')">
            <a th:href="@{/ventes}" class="text-decoration-none text-reset">
                <div class="card carte-role shadow-sm h-100"><div class="card-body">
                    <h2 class="h6">🧾 Ventes</h2>
                    <p class="small text-muted mb-0">Enregistrer une vente et voir l'historique.</p>
                </div></div>
            </a>
        </div>
        <div class="col-md-6 col-lg-3" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin}" class="text-decoration-none text-reset">
                <div class="card carte-role shadow-sm h-100"><div class="card-body">
                    <h2 class="h6">👤 Administration</h2>
                    <p class="small text-muted mb-0">Gérer les utilisateurs et leurs rôles.</p>
                </div></div>
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
