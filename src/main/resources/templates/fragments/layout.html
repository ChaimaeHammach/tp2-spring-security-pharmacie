<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' · Pharmacie'">Pharmacie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Barre de navigation : chaque lien n'apparaît QUE pour les rôles qui y ont droit (sec:authorize) -->
<nav th:fragment="navbar(page)" class="navbar navbar-expand-md navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/home}">✚ Pharmacie</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${page == 'home'} ? 'active'" th:href="@{/home}">Accueil</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','PHARMACIEN','CLIENT')">
                    <a class="nav-link" th:classappend="${page == 'medicaments'} ? 'active'" th:href="@{/medicaments}">Médicaments</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','PHARMACIEN','CAISSIER')">
                    <a class="nav-link" th:classappend="${page == 'ventes'} ? 'active'" th:href="@{/ventes}">Ventes</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${page == 'admin'} ? 'active'" th:href="@{/admin}">Administration</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3 text-white">
                <span class="small">
                    <span sec:authentication="name">user</span>
                    <span class="opacity-75" sec:authentication="principal.authorities">[ROLE]</span>
                </span>
                <!-- Déconnexion en POST : Thymeleaf ajoute le jeton CSRF caché automatiquement -->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-light">Déconnexion</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Messages flash (après une redirection) -->
<div th:fragment="messages" class="container">
    <div th:if="${succes}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${succes}">ok</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erreur}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erreur}">erreur</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="container text-center text-muted small py-4">
    TP2 Spring Security · ENSA Fès
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
